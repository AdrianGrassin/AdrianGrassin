name: Profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-stats.yml"

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: GitHub activity
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=AdrianGrassin&show_icons=true&hide_rank=true&include_all_commits=false&hide_border=true&bg_color=0d1117&title_color=ff79c6&icon_color=50fa7b&text_color=c9d1d9&border_radius=16&custom_title=GitHub%20activity
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Public repository languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=AdrianGrassin&layout=compact&langs_count=6&hide_border=true&bg_color=0d1117&title_color=ff79c6&text_color=c9d1d9&border_radius=16&card_width=360
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Save cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile stats"
          git push
